server:
  port: 8081

spring:
  application:
    name: taoqi-agent-integration
  config:
    # 加载 Nacos 中的 taoqi-agent-integration.yml；optional 允许 Nacos 不可用时仍能启动
    import: optional:nacos:${spring.application.name}.yml?group=${NACOS_GROUP:DEFAULT_GROUP}&refreshEnabled=true
  cloud:
    nacos:
      # Nacos 服务端地址，部署环境通过环境变量 NACOS_ADDR 覆盖
      server-addr: ${NACOS_ADDR:localhost:8848}
      config:
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
      discovery:
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        namespace: ${NACOS_NAMESPACE:}
        # 本机多网卡或 IPv6 时固定注册回环地址，避免注册到其它服务访问不到的网卡
        ip: ${NACOS_REGISTER_IP:127.0.0.1}
  mail:
    # QQ 邮箱 SMTP 服务，SSL 端口 465
    host: smtp.qq.com
    port: 465
    # 发件 QQ 邮箱地址，可通过环境变量 QQ_MAIL_USERNAME 覆盖
    username: ${QQ_MAIL_USERNAME:1377417617@qq.com}
    # QQ 邮箱授权码（不是登录密码），建议通过环境变量 QQ_MAIL_AUTH_CODE 覆盖
    password: ${QQ_MAIL_AUTH_CODE:ijrdkfndwxlqfjeb}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  datasource:
    # 本地 MySQL 默认端口 3306，数据库名 taoqi-agent-integration，建表脚本见 resources/db/schema.sql
    # createDatabaseIfNotExist：数据库不存在时由驱动自动创建，再执行下面的建表脚本
    url: jdbc:mysql://localhost:3306/taoqi-agent-integration?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${MYSQL_USERNAME:root}
    password: "${MYSQL_PASSWORD:123456}"
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      # 每次启动都执行建表脚本；脚本使用 IF NOT EXISTS，可重复执行
      mode: always
      schema-locations: classpath:db/schema.sql
      encoding: UTF-8

mybatis-plus:
  # 自定义 SQL 位于 resources/mapper 下
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      # 主键使用数据库自增
      id-type: auto

taoqi:
  email:
    async:
      # 邮件异步发送线程池：核心/最大线程数与队列容量
      core-pool-size: 2
      max-pool-size: 4
      queue-capacity: 100
  mail:
    # 发件人地址默认与 SMTP 账号一致，可通过环境变量 QQ_MAIL_USERNAME 覆盖
    from: ${QQ_MAIL_USERNAME:1377417617@qq.com}
    personal: ChatGPT
#    personal: Taoqi Agent
