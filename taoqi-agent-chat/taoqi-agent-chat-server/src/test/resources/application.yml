spring:
  application:
    name: taoqi-agent-chat
  cloud:
    nacos:
      discovery:
        # 测试不连接 Nacos，避免依赖本地注册中心
        enabled: false
      config:
        # 测试不加载远端配置
        enabled: false
        import-check:
          enabled: false

taoqi:
  chat:
    test-email-to: test@example.com
    verification-code:
      # 测试使用内存存储，不依赖 Redis
      store-type: memory
  rate-limit:
    # 测试使用内存限流，不依赖 Redis
    store-type: memory