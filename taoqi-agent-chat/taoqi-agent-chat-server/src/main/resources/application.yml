server:
  port: 8082

spring:
  application:
    name: taoqi-agent-chat
  config:
    # 加载 Nacos 中的 taoqi-agent-chat.yml；optional 允许 Nacos 不可用时仍能启动
    import: optional:nacos:${spring.application.name}.yml?group=${NACOS_GROUP:DEFAULT_GROUP}&refreshEnabled=true
  cloud:
    nacos:
      # Nacos 服务端地址，部署环境通过环境变量 NACOS_ADDR 覆盖
      server-addr: ${NACOS_ADDR:localhost:8848}
      config:
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
      discovery:
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        namespace: ${NACOS_NAMESPACE:}
        # 本机多网卡或 IPv6 时固定注册回环地址，Feign 按服务名调用时可达
        ip: ${NACOS_REGISTER_IP:127.0.0.1}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 本机 Redis 若设置了密码，通过环境变量 REDIS_PASSWORD 注入
      password: ${REDIS_PASSWORD:123456}
  datasource:
    # AI 任务记录使用独立的 chat 库，避免与 integration 的邮件表耦合
    url: jdbc:mysql://localhost:3306/taoqi-agent-chat?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${MYSQL_USERNAME:root}
    password: "${MYSQL_PASSWORD:123456}"
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      # 每次启动都执行建表脚本；脚本使用 IF NOT EXISTS，可重复执行
      mode: always
      schema-locations: classpath:db/schema.sql
      encoding: UTF-8

mybatis-plus:
  # 自定义 SQL 位于 resources/mapper 下（当前任务查询全部使用 BaseMapper）
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      # 主键使用数据库自增
      id-type: auto

logging:
  pattern:
    # 在日志中打印 taoqi-agent-starter 写入 MDC 的 traceId，未生成时显示 -
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"

rocketmq:
  # RocketMQ 名字服务地址，部署环境通过环境变量 ROCKETMQ_NAME_SERVER 覆盖
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: ${ROCKETMQ_AGENT_TASK_PRODUCER_GROUP:taoqi-agent-chat-agent-task-producer}

taoqi:
  rate-limit:
    # memory：单机内存；redis：多实例共享计数（本机 Redis 6379）
    store-type: ${RATE_LIMIT_STORE_TYPE:redis}
  chat:
    # 测试接口的默认收件人地址
    test-email-to: ${CHAT_TEST_EMAIL_TO:1377417617@qq.com}
    verification-code:
      # redis：多实例共享验证码；memory：单实例内存，本地无 Redis 时使用
      store-type: ${VERIFICATION_CODE_STORE_TYPE:redis}
    agent-task:
      # mq：任务经 RocketMQ 异步执行；local：本机线程池，本地没有 RocketMQ 时使用
      dispatch-mode: ${AGENT_TASK_DISPATCH_MODE:mq}
      # 模拟模型调用的耗时（毫秒），接入真实模型后失效
      simulate-delay-millis: ${AGENT_TASK_SIMULATE_DELAY_MILLIS:3000}
      topic: ${ROCKETMQ_AGENT_TASK_TOPIC:taoqi-chat-agent-task}
      consumer-group: ${ROCKETMQ_AGENT_TASK_CONSUMER_GROUP:taoqi-agent-chat-agent-task-consumer}
      # 死信主题与死信消费组由原消费组派生，避免两处名字不一致
      dlq-topic: "%DLQ%${taoqi.chat.agent-task.consumer-group}"
      dlq-consumer-group: "${taoqi.chat.agent-task.consumer-group}-dlq-consumer"
